<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isera Case | Official Links</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="/logo.jpg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Container Animasi Background Emoji */
        .bg-emoji-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            user-select: none;
            opacity: 0.35;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .profile {
            margin-bottom: 28px;
        }

        .profile-img-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
        }

        .badge-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #38ef7d;
            color: #fff;
            font-size: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }

        .profile h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: 0.5px;
        }

        .profile p {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 6px;
            line-height: 1.4;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            text-decoration: none;
            color: #2d3748;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            border-color: #cbd5e0;
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
        }

        /* Warna Brand Icon */
        .shopee .link-icon {
            background: linear-gradient(135deg, #ff5722, #ee4d2d);
        }

        .instagram .link-icon {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .tiktok .link-icon {
            background: #000000;
        }

        .whatsapp .link-icon {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .arrow-icon {
            color: #a0aec0;
            font-size: 0.85rem;
            transition: transform 0.25s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(3px);
            color: #4a5568;
        }

        footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #a0aec0;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <!-- Container untuk Animasi Background Emoji -->
    <div class="bg-emoji-container" id="emojiBg"></div>

    <div class="container">
        <!-- Header Profil -->
        <div class="profile">
            <div class="profile-img-container">
                <img src="/logo.jpg" alt="Isera Case Logo" class="profile-img" id="profilePic">
                <div class="badge-icon"><i class="fa-solid fa-gem"></i></div>
            </div>
            <h1>Isera Case</h1>
            <p>Elegance You Can See 💎</p>
        </div>

        <!-- Daftar Tautan -->
        <div class="links-container">

            <!-- Link Shopee -->
            <a href="https://shopee.co.id/iseracase.id" target="_blank" class="link-card shopee"
                onclick="trackClick('Shopee')">
                <div class="link-info">
                    <div class="link-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                    <span>Beli di Shopee</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Link Instagram -->
            <a href="https://instagram.com/iseracase" target="_blank" class="link-card instagram"
                onclick="trackClick('Instagram')">
                <div class="link-info">
                    <div class="link-icon"><i class="fa-brands fa-instagram"></i></div>
                    <span>Instagram (@iseracase)</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Link TikTok -->
            <a href="https://tiktok.com/@iseracase.id" target="_blank" class="link-card tiktok"
                onclick="trackClick('TikTok')">
                <div class="link-info">
                    <div class="link-icon"><i class="fa-brands fa-tiktok"></i></div>
                    <span>TikTok Official</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Link WhatsApp -->
            <a href="https://wa.me/6285190960420?text=Halo%20Isera%20Case,%20saya%20mau%20tanya%20produk"
                target="_blank" class="link-card whatsapp" onclick="trackClick('WhatsApp')">
                <div class="link-info">
                    <div class="link-icon"><i class="fa-brands fa-whatsapp"></i></div>
                    <span>Chat WhatsApp Admin</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

        </div>

        <!-- Footer -->
        <footer>
            &copy; 2026 Isera Case. All Rights Reserved.
        </footer>
    </div>

    <script>
        // Fungsi log sederhana saat tombol diklik
        function trackClick(platform) {
            console.log('Pengunjung mengklik tautan:', platform);
        }

        // Skrip Pembuat Animasi Floating Emoji (Berlian, HP, & Aksesori)
        const emojiBg = document.getElementById('emojiBg');
        const emojis = ['💎', '📱', '✨', '🎧', '⚡', '💎']; // Emoji berlian, hp, & aksesoris

        function createFloatingEmoji() {
            const emojiEl = document.createElement('div');
            emojiEl.classList.add('floating-emoji');

            // Pilih emoji secara acak
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            emojiEl.innerText = randomEmoji;

            // Ukuran acak (18px - 34px)
            const randomSize = Math.floor(Math.random() * 16) + 18;
            emojiEl.style.fontSize = `${randomSize}px`;

            // Posisi horizontal acak (0% - 95%)
            const randomLeft = Math.random() * 95;
            emojiEl.style.left = `${randomLeft}%`;

            // Durasi melayang acak (8 detik - 15 detik)
            const randomDuration = Math.random() * 7 + 8;
            emojiEl.style.animationDuration = `${randomDuration}s`;

            emojiBg.appendChild(emojiEl);

            // Hapus elemen dari DOM setelah animasi selesai
            setTimeout(() => {
                emojiEl.remove();
            }, randomDuration * 1000);
        }

        // Buat emoji baru setiap 800ms
        setInterval(createFloatingEmoji, 800);
    </script>

</body>

</html>
